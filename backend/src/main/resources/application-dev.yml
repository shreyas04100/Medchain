spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:medchain-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
